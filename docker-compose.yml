services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infrawatch
      POSTGRES_PASSWORD: infrawatch
      POSTGRES_DB: infrawatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrawatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes: [kafkadata:/var/lib/kafka/data]

  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    ports: ["4080:4080"]
    environment:
      ZINC_FIRST_ADMIN_USER: admin
      ZINC_FIRST_ADMIN_PASSWORD: admin123
      ZINC_DATA_PATH: /data
    volumes: [zincdata:/data]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]   # UI on :8025, SMTP on :1025

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://infrawatch:infrawatch@postgres:5432/infrawatch
      KAFKA_BOOTSTRAP: kafka:19092
      ZINC_URL: http://zincsearch:4080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  kafkadata:
  zincdata:
  qdrantdata:
